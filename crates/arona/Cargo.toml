[package]
# crates.io 上的包名。`arona` 这个名字早年被一个计算机化自适应测试项目占了，
# 所以发布名带 -rs 后缀；下面 [lib] 仍叫 arona，源码与插件一律 use arona::…，
# 依赖方只需 `arona = { package = "arona-rs", … }` 重命名一次即可，代码不用改。
name = "arona-rs"
version = "1.4.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Arona 框架：OneBot 连接、管理面板(GUI)、群授权与命令分发；功能由插件提供"
readme = "README.md"
keywords = ["onebot", "qq", "bot", "plugin"]
categories = ["network-programming"]

[lib]
# 库名保持 arona：包名换成 arona-rs 只为在 crates.io 上占得到名字
name = "arona"
path = "src/lib.rs"

[dependencies]
tokio = { workspace = true }
axum = { workspace = true }
tokio-tungstenite = { workspace = true }
futures-util = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
# 框架侧聊天记录缓存（runtime::chatlog）自带一个 SQLite 库；bundled 随包静态编译，
# 与插件用的那份是同一个 workspace 依赖，不引入任何外部运行库
rusqlite = { workspace = true }
reqwest = { workspace = true }
chrono = { workspace = true }
uuid = { workspace = true }
base64 = { workspace = true }
once_cell = { workspace = true }
log = { workspace = true }
# 启动时扫描 plugins/ 目录、把功能插件 dll 映射进进程（见 plugin::dynamic）
libloading = { workspace = true }
image = { workspace = true }
# 惰性字面（runtime::text）：三个出图插件共用这一份实现，见该模块的头注释
ab_glyph = { workspace = true }
# GUI 管理面板：由 host 通过 `arona/gui` 打开（插件依赖本 crate 时不会强制启用）
eframe = { workspace = true, optional = true }
wgpu = { workspace = true, optional = true }

[features]
default = ["gui"]
gui = ["dep:eframe", "dep:wgpu"]
