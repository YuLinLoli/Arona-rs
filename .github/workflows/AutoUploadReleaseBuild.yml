# 自动发布：推送 v* 标签时构建 Windows 发布版并创建 GitHub Release
# 参考: https://github.com/YuLinLoli/arona/blob/1.2.0-testonebot/.github/workflows/AutoUploadReleaseBuild.yml
#
# 用法:
#   1. 改 crates/arona-host/Cargo.toml 里的 version（框架/入口版本，例如 1.0.0）
#   2. git tag v1.0.0 && git push origin v1.0.0
#   3. Actions 自动构建 -> 上传工件 -> 创建 Release
#      产物: arona-rs-1.0.0-win-x64.zip（便携版, 内含 arona-rs.exe + softgl/ + DXC DLL, 带版本号）
#            arona-rs-1.0.0-setup-win-x64.exe（安装包, 含程序介绍与 AGPLv3 全文）
#      两个包都只含框架本体：功能插件是各自仓库编出的 dll，用户装好后放进 plugins\ 目录，
#      框架启动时自动扫描装载（工具链要求见 PLUGIN_DEVELOPMENT.md）
#      渲染运行库全部随包发布: 解压/安装后无需装任何依赖就能打开管理面板
#      裸 exe 不上传: 要单文件就用安装包（或自己解压 zip）, 这样 Release 里不会有
#      名字相同、无法区分版本的 arona-rs.exe
# 也可以在 Actions 页面手动 Run workflow（手动触发时跳过版本校验、只构建不发布）。
name: AutoUploadReleaseBuild

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  # 1) 在 Windows 上跑单元测试，产出主程序 exe、便携 zip 与安装包
  Build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 打包阶段要用 installer/ 里的脚本与文案，构建阶段要用 assets/ 里的图标与清单。
      # 这些文件曾经漏提交过，CI 上只会得到一句 "The directory name is invalid"，
      # 所以这里先检查一遍，失败信息更直白。
      - name: Check required files
        shell: pwsh
        run: |
          $required = @(
            'installer/arona-rs.iss',
            'installer/intro.txt',
            'installer/defaults',
            'installer/languages',
            'assets/arona.ico',
            'assets/arona.manifest'
          )
          $missing = @($required | Where-Object { -not (Test-Path $_) })
          if ($missing.Count -gt 0) {
            Write-Error "仓库缺少以下必需文件（记得 git add 后提交）: $($missing -join ', ')"
            exit 1
          }
          Write-Host "必需文件检查通过"

      # 工具链版本由仓库根的 rust-toolchain.toml 唯一决定：ABI 指纹里带着 rustc 的 release 号，
      # CI 用当天的 stable 编产物，插件就会和正式宿主对不上指纹而被拒载。rustup 会照那份文件
      # 自动装好对应版本，这里只把真正生效的版本打进日志，出事时先在日志里核对。
      - name: Show active toolchain
        run: |
          rustup show active-toolchain
          rustc -vV
        shell: pwsh

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      # 标签和 arona-host 版本号对不上时（如 tag v1.0.0 但 Cargo.toml 还是 0.9.0）直接失败,
      # 避免产出与 Release 名字不一致的产物。手动触发时会跳过这一步。
      - name: Verify tag matches Cargo.toml version
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $meta = cargo metadata --no-deps --format-version 1 | ConvertFrom-Json
          # workspace 里有多个包，产物版本取可执行入口 arona-host 的
          $version = ($meta.packages | Where-Object { $_.name -eq 'arona-host' }).version
          $tag = "${{ github.ref_name }}".TrimStart('v')
          if ($tag -ne $version) {
            Write-Error "标签 ${{ github.ref_name }} 与 arona-host 版本 $version 不一致"
            exit 1
          }
          Write-Host "版本校验通过: $version"

      # 只跑非 ignored 的离线单元测试; 联网冒烟自检(cargo smoke-*)都带 #[ignore], 不会在这里执行
      - name: Test
        run: cargo test --release

      # CPU 软件渲染依赖(Mesa llvmpipe): 让没有显卡驱动 / 没有 DX12 的服务器也能打开管理面板。
      # 约 62MB, 不入库(.gitignore 忽略了 /softgl/), 构建时现拉。
      # 必须放在 dist/installer 之前: 它们会把仓库根的 softgl/ 复制到 target/release/softgl/。
      # 安装包把它作为必装组件, 所以这里失败就直接让构建失败, 避免发布出服务器打不开 GUI 的包
      - name: Fetch software OpenGL (softgl)
        shell: pwsh
        run: ./scripts/fetch-softgl.ps1

      - name: Verify softgl payload
        shell: pwsh
        run: |
          if (-not (Test-Path softgl/opengl32.dll)) {
            Write-Error "softgl/ 拉取失败: 缺少 opengl32.dll"
            exit 1
          }
          Write-Host "softgl OK: $((Get-ChildItem softgl | Measure-Object -Property Length -Sum).Sum / 1MB) MB"

      # 着色器编译器运行时(Microsoft 官方 DXC 发布包): DX12 后端优先用它编译着色器,
      # 是渲染降级链的第一档。约 30MB, 不入库(.gitignore 忽略了 /dxc/), 构建时现拉。
      # 同样必须在 dist/installer 之前: 它们把 dxc/*.dll 复制到 target/release/(exe 同级)。
      - name: Fetch DXC shader compiler
        shell: pwsh
        run: ./scripts/fetch-dxc.ps1

      - name: Verify DXC payload
        shell: pwsh
        run: |
          if (-not (Test-Path dxc/dxcompiler.dll)) {
            Write-Error "dxc/ 拉取失败: 缺少 dxcompiler.dll"
            exit 1
          }
          Write-Host "dxc OK: $((Get-ChildItem dxc | Measure-Object -Property Length -Sum).Sum / 1MB) MB"

      # 等价于 cargo dist, 这里写全命令以免依赖 .cargo/config.toml 的别名
      # 该用例会做 cargo build --release, 产物主程序固定为 target/release/arona-rs.exe(不带版本号)
      - name: Build dist
        run: cargo test -p arona-host dist_build --release -- --ignored --nocapture --test-threads=1

      - name: Get Artifact Name
        shell: pwsh
        run: |
          # 主程序固定叫 arona-rs.exe(不带版本号, 便于覆盖升级); 版本号从 arona-host 读,
          # 只用于便携 zip / 安装包的文件名
          $exe = "target/release/arona-rs.exe"
          if (-not (Test-Path $exe)) { Write-Error "未找到构建产物 $exe"; exit 1 }
          $meta = cargo metadata --no-deps --format-version 1 | ConvertFrom-Json
          $version = ($meta.packages | Where-Object { $_.name -eq 'arona-host' }).version
          Write-Host "构建产物: $exe (版本 $version)"
          "APP_VERSION=$version" >> $env:GITHUB_ENV
          "ARTIFACT_PATH=$exe" >> $env:GITHUB_ENV
          "ARTIFACT_NAME=arona-rs-$version" >> $env:GITHUB_ENV

      # 安装包用 Inno Setup 6 编译（installer/arona-rs.iss）: 程序介绍 + AGPLv3 全文 +
      # 默认配置（缺失才释放）+ softgl/ 单独打包、安装时释放到安装目录
      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      # 等价于 cargo installer: 调用 ISCC 生成 arona-rs-<版本号>-setup-win-x64.exe
      - name: Build installer
        run: cargo test -p arona-host installer_build --release -- --ignored --nocapture --test-threads=1

      - name: Package zip
        shell: pwsh
        run: |
          $paths = @($env:ARTIFACT_PATH)
          if (Test-Path target/release/softgl) {
            $paths += "target/release/softgl"
          } else {
            Write-Warning "缺少 softgl, 压缩包内不含软件 OpenGL"
          }
          # DXC 是 exe 同级的散装 DLL, 便携 zip 解压后必须保持同级才能被加载
          foreach ($dll in @('dxcompiler.dll', 'dxil.dll')) {
            $p = "target/release/$dll"
            if (Test-Path $p) { $paths += $p } else { Write-Warning "缺少 $dll, 压缩包内不含 DXC" }
          }
          $zip = "target/release/$($env:ARTIFACT_NAME)-win-x64.zip"
          Compress-Archive -Path $paths -DestinationPath $zip -Force
          Write-Host "打包完成: $zip"
          "ZIP_PATH=$zip" >> $env:GITHUB_ENV

          $setup = "target/release/arona-rs-$($env:APP_VERSION)-setup-win-x64.exe"
          if (-not (Test-Path $setup)) { Write-Error "未找到安装包 $setup"; exit 1 }
          "SETUP_PATH=$setup" >> $env:GITHUB_ENV

      # 上传工件: 便携 zip + 安装包（裸 exe 只用于打包 zip/安装包，不单独上传）
      - name: Upload-Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: |
            ${{ env.ZIP_PATH }}
            ${{ env.SETUP_PATH }}
          compression-level: 0

  # 2) 取回工件并发布 Release
  Publish:
    needs: Build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download-Artifact
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      # 自动发布
      - name: Publish Release
        uses: ncipollo/release-action@v1
        with:
          artifacts: "dist/*"
          prerelease: ${{ contains(github.ref, 'pre') }}
          generateReleaseNotes: true
          allowUpdates: true
          token: ${{ secrets.GITHUB_TOKEN }}