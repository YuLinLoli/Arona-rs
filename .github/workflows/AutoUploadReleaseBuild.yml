# 自动发布：推送 v* 标签时构建 Windows 与 Linux 发布版并创建 GitHub Release
# 参考: https://github.com/YuLinLoli/arona/blob/1.2.0-testonebot/.github/workflows/AutoUploadReleaseBuild.yml
#
# 用法:
#   1. 改 crates/arona-host/Cargo.toml 里的 version（框架/入口版本，例如 1.0.0）
#   2. git tag v1.0.0 && git push origin v1.0.0
#   3. Actions 自动构建 -> 上传工件 -> 创建 Release
#      产物: arona-rs-1.0.0-win-x64.zip（便携版, 内含 arona-rs.exe + softgl/ + DXC DLL, 带版本号）
#            arona-rs-1.0.0-setup-win-x64.exe（安装包, 含程序介绍与 AGPLv3 全文）
#            arona-rs-1.0.0-linux-x64.tar.gz（Linux 标准包, 按构建机 glibc 基线）
#            arona-rs-1.0.0-linux-x64-compat.tar.gz（Linux 宽兼容包, glibc 2.17 基线）
#      所有包都只含框架本体：功能插件是各自仓库编出的 dll/so，用户装好后放进 plugins/ 目录，
#      框架启动时自动扫描装载（工具链要求见 PLUGIN_DEVELOPMENT.md）
#      Windows 包的渲染运行库全部随包发布: 解压/安装后无需装任何依赖就能打开管理面板
#      Linux 版只提供命令行模式（不编 eframe/wgpu），因此不需要任何图形库；
#      两个 Linux 包都是 glibc 动态链接——静态化会毁掉插件装载能力，不能做
#      裸 exe 不上传: 要单文件就用安装包（或自己解压 zip）, 这样 Release 里不会有
#      名字相同、无法区分版本的 arona-rs.exe
# 也可以在 Actions 页面手动 Run workflow（手动触发时跳过版本校验、只构建不发布）。
name: AutoUploadReleaseBuild

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  # 1) 在 Windows 上跑单元测试，产出主程序 exe、便携 zip 与安装包
  Build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 打包阶段要用 installer/ 里的脚本与文案，构建阶段要用 assets/ 里的图标与清单。
      # 这些文件曾经漏提交过，CI 上只会得到一句 "The directory name is invalid"，
      # 所以这里先检查一遍，失败信息更直白。
      - name: Check required files
        shell: pwsh
        run: |
          $required = @(
            'installer/arona-rs.iss',
            'installer/intro.txt',
            'installer/defaults',
            'installer/languages',
            'assets/arona.ico',
            'assets/arona.manifest'
          )
          $missing = @($required | Where-Object { -not (Test-Path $_) })
          if ($missing.Count -gt 0) {
            Write-Error "仓库缺少以下必需文件（记得 git add 后提交）: $($missing -join ', ')"
            exit 1
          }
          Write-Host "必需文件检查通过"

      # 工具链版本由仓库根的 rust-toolchain.toml 唯一决定：ABI 指纹里带着 rustc 的 release 号，
      # CI 用当天的 stable 编产物，插件就会和正式宿主对不上指纹而被拒载。rustup 会照那份文件
      # 自动装好对应版本，这里只把真正生效的版本与 rustc -vV 打进日志（后者的 release/host 两行
      # 就是指纹的前两段，出事时先在日志里跟插件上报的那份逐段对）。
      - name: Show active toolchain
        run: |
          rustup show active-toolchain
          rustc -vV
        shell: pwsh

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      # 标签和 arona-host 版本号对不上时（如 tag v1.0.0 但 Cargo.toml 还是 0.9.0）直接失败,
      # 避免产出与 Release 名字不一致的产物。手动触发时会跳过这一步。
      - name: Verify tag matches Cargo.toml version
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $meta = cargo metadata --no-deps --format-version 1 | ConvertFrom-Json
          # workspace 里有多个包，产物版本取可执行入口 arona-host 的
          $version = ($meta.packages | Where-Object { $_.name -eq 'arona-host' }).version
          $tag = "${{ github.ref_name }}".TrimStart('v')
          if ($tag -ne $version) {
            Write-Error "标签 ${{ github.ref_name }} 与 arona-host 版本 $version 不一致"
            exit 1
          }
          Write-Host "版本校验通过: $version"

      # 只跑非 ignored 的离线单元测试; 联网冒烟自检(cargo smoke-*)都带 #[ignore], 不会在这里执行
      - name: Test
        run: cargo test --release

      # CPU 软件渲染依赖(Mesa llvmpipe): 让没有显卡驱动 / 没有 DX12 的服务器也能打开管理面板。
      # 约 62MB, 不入库(.gitignore 忽略了 /softgl/), 构建时现拉。
      # 必须放在 dist/installer 之前: 它们会把仓库根的 softgl/ 复制到 target/release/softgl/。
      # 安装包把它作为必装组件, 所以这里失败就直接让构建失败, 避免发布出服务器打不开 GUI 的包
      - name: Fetch software OpenGL (softgl)
        shell: pwsh
        run: ./scripts/fetch-softgl.ps1

      - name: Verify softgl payload
        shell: pwsh
        run: |
          if (-not (Test-Path softgl/opengl32.dll)) {
            Write-Error "softgl/ 拉取失败: 缺少 opengl32.dll"
            exit 1
          }
          Write-Host "softgl OK: $((Get-ChildItem softgl | Measure-Object -Property Length -Sum).Sum / 1MB) MB"

      # 着色器编译器运行时(Microsoft 官方 DXC 发布包): DX12 后端优先用它编译着色器,
      # 是渲染降级链的第一档。约 30MB, 不入库(.gitignore 忽略了 /dxc/), 构建时现拉。
      # 同样必须在 dist/installer 之前: 它们把 dxc/*.dll 复制到 target/release/(exe 同级)。
      - name: Fetch DXC shader compiler
        shell: pwsh
        run: ./scripts/fetch-dxc.ps1

      - name: Verify DXC payload
        shell: pwsh
        run: |
          if (-not (Test-Path dxc/dxcompiler.dll)) {
            Write-Error "dxc/ 拉取失败: 缺少 dxcompiler.dll"
            exit 1
          }
          Write-Host "dxc OK: $((Get-ChildItem dxc | Measure-Object -Property Length -Sum).Sum / 1MB) MB"

      # 等价于 cargo dist, 这里写全命令以免依赖 .cargo/config.toml 的别名
      # 该用例会做 cargo build --release, 产物主程序固定为 target/release/arona-rs.exe(不带版本号)
      - name: Build dist
        run: cargo test -p arona-host dist_build --release -- --ignored --nocapture --test-threads=1

      - name: Get Artifact Name
        shell: pwsh
        run: |
          # 主程序固定叫 arona-rs.exe(不带版本号, 便于覆盖升级); 版本号从 arona-host 读,
          # 只用于便携 zip / 安装包的文件名
          $exe = "target/release/arona-rs.exe"
          if (-not (Test-Path $exe)) { Write-Error "未找到构建产物 $exe"; exit 1 }
          $meta = cargo metadata --no-deps --format-version 1 | ConvertFrom-Json
          $version = ($meta.packages | Where-Object { $_.name -eq 'arona-host' }).version
          Write-Host "构建产物: $exe (版本 $version)"
          "APP_VERSION=$version" >> $env:GITHUB_ENV
          "ARTIFACT_PATH=$exe" >> $env:GITHUB_ENV
          "ARTIFACT_NAME=arona-rs-$version" >> $env:GITHUB_ENV

      # 安装包用 Inno Setup 6 编译（installer/arona-rs.iss）: 程序介绍 + AGPLv3 全文 +
      # 默认配置（缺失才释放）+ softgl/ 单独打包、安装时释放到安装目录
      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      # 等价于 cargo installer: 调用 ISCC 生成 arona-rs-<版本号>-setup-win-x64.exe
      - name: Build installer
        run: cargo test -p arona-host installer_build --release -- --ignored --nocapture --test-threads=1

      - name: Package zip
        shell: pwsh
        run: |
          $paths = @($env:ARTIFACT_PATH)
          if (Test-Path target/release/softgl) {
            $paths += "target/release/softgl"
          } else {
            Write-Warning "缺少 softgl, 压缩包内不含软件 OpenGL"
          }
          # DXC 是 exe 同级的散装 DLL, 便携 zip 解压后必须保持同级才能被加载
          foreach ($dll in @('dxcompiler.dll', 'dxil.dll')) {
            $p = "target/release/$dll"
            if (Test-Path $p) { $paths += $p } else { Write-Warning "缺少 $dll, 压缩包内不含 DXC" }
          }
          # 随包中文字体: 安装包从 installer/fonts 释放到 {app}\fonts, 便携版同样带上这一目录,
          # 否则解压用法拿不到 fonts/ —— GUI 与出图插件会退回系统字体候选(能用, 但观感随机器漂)
          if (Test-Path installer/fonts) {
            $paths += "installer/fonts"
          } else {
            Write-Warning "缺少 installer/fonts, 压缩包内不含随包中文字体"
          }
          $zip = "target/release/$($env:ARTIFACT_NAME)-win-x64.zip"
          Compress-Archive -Path $paths -DestinationPath $zip -Force
          Write-Host "打包完成: $zip"
          "ZIP_PATH=$zip" >> $env:GITHUB_ENV

          $setup = "target/release/arona-rs-$($env:APP_VERSION)-setup-win-x64.exe"
          if (-not (Test-Path $setup)) { Write-Error "未找到安装包 $setup"; exit 1 }
          "SETUP_PATH=$setup" >> $env:GITHUB_ENV

      # 上传工件: 便携 zip + 安装包（裸 exe 只用于打包 zip/安装包，不单独上传）
      - name: Upload-Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: |
            ${{ env.ZIP_PATH }}
            ${{ env.SETUP_PATH }}
          compression-level: 0

  # 2) 在 Linux 上构建两个 Linux 交付包（仅命令行版，不含管理面板）
  #
  # 为什么是两个包：标准包按 runner 的 glibc 基线编，是发行版的原生形态；
  # 宽兼容包钉 glibc 2.17（CentOS 7 / Ubuntu 16.04 时代的水位），之后所有发行版都能跑。
  # 两种用户都存在（追新的与部署在老系统/容器里的），合并成一个就只能二选一。
  #
  # **两个包都是 glibc 动态链接**，这一点不可协商：musl 静态二进制里 dlopen 是空桩，
  # 装不了插件；rustc 也不支持 musl 的 cdylib，插件编不出来。能装插件是硬前提。
  #
  # Linux 版不编 eframe/wgpu（`--no-default-features`），所以整条流水线不需要 X11、Wayland、
  # OpenGL 或任何图形库；TLS 走 rustls，也不需要系统的 OpenSSL。
  LinuxBuild:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 工具链版本同样由仓库根的 rust-toolchain.toml 决定（与 Windows 侧一致）
      - name: Show active toolchain
        run: |
          rustup show active-toolchain
          rustc -vV

      # 宽兼容包要的最后一环：zig 提供多版本 glibc 的头与链接器，cargo-zigbuild 负责
      # 把它包装成 cc-rs/rustc 认得的形态。没有它只会少一个包，标准包照常产出。
      #
      # 直接从 ziglang.org 取官方二进制，不引第三方 setup action：这里少一个会随版本
      # 失效的间接依赖，排查也更直接（URL 拼错时报的是 404，不是某个 action 的谜语）。
      - name: Install zig
        env:
          ZIG_VERSION: "0.17.0"
        run: |
          set -euo pipefail
          url="https://ziglang.org/download/${ZIG_VERSION}/zig-x86_64-linux-${ZIG_VERSION}.tar.xz"
          echo "下载 $url"
          curl -fsSL "$url" -o /tmp/zig.tar.xz
          mkdir -p "$HOME/zig"
          tar -xJf /tmp/zig.tar.xz -C "$HOME/zig" --strip-components=1
          echo "$HOME/zig" >> "$GITHUB_PATH"
          "$HOME/zig/zig" version

      # 版本钉住：cargo-zigbuild 与 zig 的兼容面是成对变化的，最新的那个不一定配得上
      # 上面装的 zig。0.23.x + zig 0.17 是本地验证过的组合。
      - name: Install cargo-zigbuild
        run: cargo install cargo-zigbuild --version '^0.23' --locked

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      # Linux 交付的就是不含 GUI 的构建（`--no-default-features`），测试也按这个形态跑：
      # 既验证的正是要发出去的那份东西，又不白编一遍 eframe/wgpu 那一大坨。
      # Windows 侧因为交付带 GUI，那边跑的是默认 features。
      - name: Test
        run: cargo test --release --workspace --no-default-features

      # 等价于 cargo linux-dist：出标准包 + 宽兼容包两个 tar.gz
      - name: Build Linux packages
        run: cargo test -p arona-host linux_dist --release -- --ignored --nocapture --test-threads=1

      # 两个包必须都在。linux_dist 在工具链缺失时会**静默跳过**兼容包（本地开发时这是
      # 友好的），但发布流水线上少一个包就是事故，所以这里显式要求两个都在。
      - name: Verify both packages exist
        run: |
          set -euo pipefail
          ls -la target/release/*.tar.gz
          for kind in "" "-compat"; do
            if ! ls target/release/arona-rs-*-linux-x64${kind}.tar.gz >/dev/null 2>&1; then
              echo "缺少 arona-rs-*-linux-x64${kind}.tar.gz"; exit 1
            fi
          done
          echo "标准包与宽兼容包都在"

      # 冒烟：包里的二进制必须真的能起来。用超时兜住——
      # 机器人连不上 OneBot 也该先打出启动横幅、运行平台与配置路径
      - name: Smoke test the compat binary
        run: |
          set -e
          mkdir -p /tmp/smoke && cd /tmp/smoke
          tar -xzf "$GITHUB_WORKSPACE"/target/release/arona-rs-*-linux-x64-compat.tar.gz
          cd arona-rs-*-linux-x64-compat
          file ./arona-rs
          ldd ./arona-rs || true
          set +e
          timeout 8 ./arona-rs --nogui > out.log 2>&1
          code=$?
          set -e
          cat out.log
          # 124 = 被 timeout 杀掉，说明它正常跑着（没有崩溃退出）
          if [ "$code" -ne 0 ] && [ "$code" -ne 124 ]; then
            echo "二进制启动失败，退出码 $code"; exit 1
          fi
          grep -q "运行平台" out.log || { echo "没有看到平台体检输出"; exit 1; }
          echo "Linux 二进制冒烟通过"

      # 宽兼容包的 glibc 基线必须真的钉住：用字符串扫一遍最高符号版本，
      # 超过 2.17 就说明 zigbuild 的目标后缀没生效，包会在老系统上炸
      - name: Verify compat glibc baseline
        run: |
          set -e
          mkdir -p /tmp/verify && cd /tmp/verify
          tar -xzf "$GITHUB_WORKSPACE"/target/release/arona-rs-*-linux-x64-compat.tar.gz
          bin=$(find . -name arona-rs -type f | head -1)
          max=$(objdump -T "$bin" | grep -o 'GLIBC_2\.[0-9]*' | sort -u -V | tail -1)
          echo "最高 GLIBC 符号: $max"
          if [ "$max" != "GLIBC_2.17" ]; then
            echo "宽兼容包的 glibc 基线不是 2.17（实得 $max），目标后缀没生效"; exit 1
          fi

      - name: Get artifact name
        run: |
          version=$(cargo metadata --no-deps --format-version 1 \
            | python3 -c "import json,sys; d=json.load(sys.stdin); print([p['version'] for p in d['packages'] if p['name']=='arona-host'][0])")
          echo "APP_VERSION=$version" >> "$GITHUB_ENV"
          echo "ARTIFACT_NAME=arona-rs-$version-linux" >> "$GITHUB_ENV"

      - name: Upload-Artifact-Linux
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: target/release/arona-rs-*-linux-x64*.tar.gz
          compression-level: 0

  # 3) 取回工件并发布 Release
  Publish:
    needs: [Build, LinuxBuild]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download-Artifact
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      # 自动发布
      - name: Publish Release
        uses: ncipollo/release-action@v1
        with:
          artifacts: "dist/*"
          prerelease: ${{ contains(github.ref, 'pre') }}
          generateReleaseNotes: true
          allowUpdates: true
          token: ${{ secrets.GITHUB_TOKEN }}