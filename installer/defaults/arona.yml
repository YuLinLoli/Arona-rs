# ==================== Arona 业务配置 ====================
# Rust 移植版（arona-rs）独立运行模式使用本文件，修改后保存即自动热重载。
# OneBot 协议连接配置见同目录 onebot.yml；本文件只放非 OneBot 的业务配置。

# 允许响应的群号列表，留空表示响应所有群
groups: []
# 管理员 QQ 号列表，可执行管理命令
managers: []

# ==================== 每日活动推送 ====================
# 每天 every_day_hour 点向目标群推送国服/国际服/日服活动日历
notify:
  # 是否启用每日活动防侠推送
  enable: true
  # 每日推送的小时(0-23)
  every_day_hour: 8
  # 是否推送日服/国际服/国服活动
  jp: true
  global: true
  cn: true
  # 不推送的群号列表（黑名单），留空表示推送到全部允许的群
  black_groups: []
  # 推送消息开头文字
  notify_text: "碧蓝档案预警"
