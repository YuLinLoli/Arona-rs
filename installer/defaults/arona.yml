# ==================== Arona 框架配置 ====================
# 框架启动时读本文件，改完保存即自动热重载。
# OneBot 协议连接配置见同目录 onebot.yml；本文件只放非 OneBot 的配置。
#
# 这里只有框架自己的项。功能插件的配置住在各自的 config/<插件>/arona.yml
# （插件 id 是什么，目录名就是什么，例如 config/hello/arona.yml），插件加载后自动生成带注释的模板，
# 框架不需要知道插件有哪些配置项，因此升级插件改了默认值也只会补齐插件自己那份文件。

# 允许响应的群号列表，留空表示响应所有群
groups: []
# 管理员 QQ 号列表，可执行管理命令
managers: []

# ==================== 框架行为 ====================
# 同一插件连续 panic 多少次就自动隔离停用（0 = 只记日志、不停用），留默认即可
framework:
  panic_disable_threshold: 5
  # 未声明 with_prefix_match 的命令是否也允许最短前缀匹配（开着时输入 /stat 也能命中 /status）
  prefix_match_by_default: false

# ==================== 聊天记录缓存 ====================
# QQ 的引用只认 OneBot 实现端缓存里的近期消息，久了就引用不到。
# 框架因此自己记一份聊天数据（data/arona/chatlog.db，图片只存原链接），
# 供插件做「引用回复」与按存储 id 的「撤回消息」。改动即时生效，不必重启。
chatlog:
  # 总开关：关掉后不再记账，引用还原与撤回时的 id 换算一起停
  enable: true
  # 本地保留几天的聊天消息（超出的由下面的清理任务删掉）
  keep_days: 2
  # 每隔几天清一次过期记录
  purge_interval_days: 4
  # 多少分钟内的引用仍由实现端直接挂原生引用，超过才用本地记录还原成文字+图片
  quote_ttl_minutes: 30
