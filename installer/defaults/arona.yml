# ==================== Arona 框架配置 ====================
# Rust 移植版（arona-rs）独立运行模式使用本文件，修改后保存即自动热重载。
# OneBot 协议连接配置见同目录 onebot.yml；本文件只放非 OneBot 的配置。
#
# 这里只有框架自己的项。功能插件的配置住在各自的 config/<插件>/arona.yml
# （例如碧蓝档案插件是 config/bluearchive/arona.yml），插件加载后自动生成带注释的模板，
# 框架不需要知道插件有哪些配置项，因此升级插件改了默认值也只会补齐插件自己那份文件。

# 允许响应的群号列表，留空表示响应所有群
groups: []
# 管理员 QQ 号列表，可执行管理命令
managers: []
