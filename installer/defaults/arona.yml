# ==================== Arona 框架配置 ====================
# Rust 移植版（arona-rs）独立运行模式使用本文件，修改后保存即自动热重载。
# OneBot 协议连接配置见同目录 onebot.yml；本文件只放非 OneBot 的配置。
#
# 这里只有框架自己的项。功能插件的配置区（例如碧蓝档案插件的 notify 每日活动推送）
# 不在安装包里写死：插件加载后会按注册顺序自动补到本文件下面，插件升级改了默认值也
# 会自动补齐新项，已有的值一律保留。

# 允许响应的群号列表，留空表示响应所有群
groups: []
# 管理员 QQ 号列表，可执行管理命令
managers: []
