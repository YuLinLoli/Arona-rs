# Cargo 别名配置（相当于本项目常用的“构建任务”快捷命令）
#
# 本工程是 workspace：
#   crates/arona         框架（OneBot + GUI + 群授权 + 命令分发 + 插件装载与生命周期）
#   crates/arona-host    可执行入口，产物 arona-rs[.exe]
#   plugins/hello        示例功能插件，产物 hello_plugin.dll —— 运行期由框架扫描 plugins/
#                        装载，宿主不链接它，因此它不出现在任何构建产物里
# build/run/dist/installer 都固定打在 -p arona-host 上：产物永远是框架本体。
#
# 用法示例：
#   cargo build-release   # 发布构建(默认含 GUI), 产物: target/release/arona-rs[.exe]
#   cargo run-nogui       # 以纯命令行(黑窗口)模式运行
#   cargo dist            # 发布构建: 产物 arona-rs[.exe]（主程序不带版本号, 交付推荐）
#   cargo installer       # 发布构建 + 打 Windows 安装包(需 Inno Setup 6, 安装包名带版本号)（见 installer/）
#   cargo build-plugin    # 构建示例插件 dll: target/release/hello_plugin.dll
#   cargo run-release     # 发布构建并直接运行框架（插件由 plugins/ 目录自动装载）
# 若需在别名后追加参数, 直接写在其后即可, 例如: cargo build-release --verbose

[alias]
# 发布构建（产物 arona-rs[.exe]）
build-release = "build --release -p arona-host"
# 发布构建 + 整理产物: target/release/arona-rs[.exe]（主程序不带版本号, 最终交付推荐）
# 注意: 本别名已带全部参数, 请不要再追加参数
dist = "test -p arona-host dist_build --release -- --ignored --nocapture --test-threads=1"
# 发布构建 + 打 Windows 安装包: target/release/arona-rs-<version>-setup-win-x64.exe（安装包带版本号）
# 安装包内含程序介绍与 AGPLv3 全文; softgl/ 大依赖单独打包、安装时释放到安装目录
# 需要 Inno Setup 6: winget install --id JRSoftware.InnoSetup
# 注意: 本别名已带全部参数, 请不要再追加参数
installer = "test -p arona-host installer_build --release -- --ignored --nocapture --test-threads=1"
# 发布构建并立即运行
run-release = "run --release -p arona-host"
# 构建示例插件（产物 target/release/hello_plugin.dll）：把它拷进运行目录的 plugins/ 再启动框架
build-plugin = "build --release -p hello-plugin"
# 发布构建(默认已含管理 GUI): 产物 target/release/arona-rs[.exe], 直接运行即打开管理面板
build-gui = "build --release -p arona-host"
# 发布构建(不含 GUI 的精简命令行版, 减小体积)
build-nogui = "build --release -p arona-host --no-default-features"
# 构建并运行(默认打开管理 GUI)
gui = "run --release -p arona-host"
# 构建并以纯命令行(黑窗口)模式运行
run-nogui = "run --release -p arona-host -- --nogui"

# 静态链接 MSVC 运行库：产物自带 VCRUNTIME/UCRT，服务器上无需装
# "Microsoft Visual C++ 2015-2022 Redistributable"（解决“缺少 VCRUNTIME140.dll”）。
# 插件仓库的 .cargo/config.toml 必须与这里一致，否则插件 dll 会被框架的 ABI 握手拒载。
[target.x86_64-pc-windows-msvc]
rustflags = ["-C", "target-feature=+crt-static"]

[target.i686-pc-windows-msvc]
rustflags = ["-C", "target-feature=+crt-static"]
