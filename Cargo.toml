[workspace]
resolver = "2"
members = ["crates/arona", "crates/arona-host", "plugins/hello"]

[workspace.package]
edition = "2024"
license = "AGPL-3.0-only"
repository = "https://github.com/YuLinLoli/Arona-rs"

# 三方依赖版本集中在这里声明，各 crate 用 `workspace = true` 继承
[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
axum = { version = "0.8", features = ["ws"] }
tokio-tungstenite = "0.24"
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
rusqlite = { version = "0.32", features = ["bundled"] }
# TLS 用 rustls 而不是 reqwest 默认的 native-tls：native-tls 在 Windows 上走系统
# schannel（天然免依赖），在 Linux 上却要链系统的 OpenSSL——那样 Linux 就再也做不出
# 「解压即用、不装任何系统库」的静态包。rustls 是纯 Rust 实现，两平台都能静态链接，
# 于是同一套 Cargo.toml 在 Windows 与 Linux(gnu/musl) 上产出的都是自包含的二进制。
# 证书走 `-native-roots`（读系统根证书库）而不是内置的 webpki-roots：企业内网自建 CA
# 那种场景与 native-tls 的行为保持一致，不会突然变成「证书不受信任」。
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls-native-roots"] }
chrono = "0.4"
uuid = { version = "1", features = ["v4"] }
rand = "0.8"
base64 = "0.22"
once_cell = "1"
log = "0.4"
# 运行期加载功能插件 dll（plugins/ 目录扫描）
libloading = "0.8"
zip = { version = "2", default-features = false, features = ["deflate"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
# 出图插件共用的惰性字面（arona::runtime::text）：只收字体文件字节，画到哪个字才解析哪个字。
# 不用 fontdue——它把每个码位的轮廓全量预解析后常驻，实测一份雅黑 307 MB、思源宋体 253 MB
ab_glyph = "0.2.32"
# GUI 管理面板（默认启用）: --no-default-features 可编译不含 GUI 的精简命令行版
# glow(OpenGL) 为主，wgpu(DX12/Vulkan，可用 WARP 软件渲染) 作为服务器/无显卡环境的备选后端
eframe = { version = "0.31", default-features = false, features = ["glow", "wgpu", "default_fonts"] }
# eframe 默认只给 wgpu 打开 metal/webgpu，DX12 必须自己开：
# 只有 DX12 后端才有 WARP 软件适配器，Windows 服务器/无显卡虚拟机靠它才能渲染。
# 不开 static-dxc：它链接的预编译 dxcompiler 静态库会引用 ATL 的 _AtlBaseModule，
# 从而强制要求 VS 的「ATL/MFC」组件里的 atls.lib（开发机常缺）；运行期改为动态加载
# 着色器编译器即可。管理面板在服务器上的兜底路径是 glow(OpenGL)+softgl，与 DXC 无关。
wgpu = { version = "24", default-features = false, features = ["dx12"] }
# 托盘图标（最小化到托盘）：只在 gui feature 下编译，Linux 精简版与插件侧都用不到。
# Windows 上它自带消息线程，不依赖 winit 的事件泵，所以在 eframe 的 update 里轮询事件即可。
tray-icon = "0.26"

[profile.release]
opt-level = 2
