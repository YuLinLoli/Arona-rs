[workspace]
resolver = "2"
members = ["crates/arona", "crates/arona-host", "plugins/bluearchive", "plugins/hello"]

[workspace.package]
edition = "2024"
license = "AGPL-3.0-only"
repository = "https://github.com/YuLinLoli/Arona-rs"

# 三方依赖版本集中在这里声明，各 crate 用 `workspace = true` 继承
[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
axum = { version = "0.8", features = ["ws"] }
tokio-tungstenite = "0.24"
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
rusqlite = { version = "0.32", features = ["bundled"] }
reqwest = { version = "0.12", features = ["json"] }
chrono = "0.4"
uuid = { version = "1", features = ["v4"] }
rand = "0.8"
base64 = "0.22"
once_cell = "1"
log = "0.4"
zip = { version = "2", default-features = false, features = ["deflate"] }
fontdue = "0.8"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
# GUI 管理面板（默认启用）: --no-default-features 可编译不含 GUI 的精简命令行版
# glow(OpenGL) 为主，wgpu(DX12/Vulkan，可用 WARP 软件渲染) 作为服务器/无显卡环境的备选后端
eframe = { version = "0.31", default-features = false, features = ["glow", "wgpu", "default_fonts"] }
# eframe 默认只给 wgpu 打开 metal/webgpu，DX12 必须自己开：
# 只有 DX12 后端才有 WARP 软件适配器，Windows 服务器/无显卡虚拟机靠它才能渲染。
# 不开 static-dxc：它链接的预编译 dxcompiler 静态库会引用 ATL 的 _AtlBaseModule，
# 从而强制要求 VS 的「ATL/MFC」组件里的 atls.lib（开发机常缺）；运行期改为动态加载
# 着色器编译器即可。管理面板在服务器上的兜底路径是 glow(OpenGL)+softgl，与 DXC 无关。
wgpu = { version = "24", default-features = false, features = ["dx12"] }

[profile.release]
opt-level = 2
