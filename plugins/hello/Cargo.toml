[package]
name = "hello-plugin"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Arona 插件开发示例：一个动态装载的 dll 插件，命令、事件钩子、出站钩子、类型化配置与每日任务各来一发"

[lib]
name = "hello_plugin"
path = "src/lib.rs"
# cdylib 产出可被框架扫描加载的 hello_plugin.dll；rlib 那份只给 `cargo test` 用，
# 宿主永远不链接它——插件与框架之间只有运行期的 dll 这一层关系。
crate-type = ["cdylib", "rlib"]

[dependencies]
# 插件只依赖框架本体，gui 由 host 决定；把 default-features 关掉才不会把 eframe 拖进来
arona = { path = "../../crates/arona", version = "1.0.0", default-features = false }
# 直接 tokio::time::sleep 的那条示例命令要用它：真实插件多半也自带 tokio，
# 而 dll 里这份 tokio 与宿主那份是两套 thread-local 上下文，框架负责在回调边界补装
tokio = { workspace = true }
serde = { workspace = true }

[dev-dependencies]
# 单测里手工拼一段 YAML，验证"用户只写一项也能读出来"
serde_yaml = { workspace = true }
